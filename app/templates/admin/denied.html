<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied — PARTBASE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body style="background-color: #0F172A; color: #FFFFFF;">
  <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-4">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center gap-2 mb-2">
        <span class="lv-logo-badge bg-primary">LV</span>
        <span class="fs-4 fw-bold text-white">PARTBASE Admin</span>
      </div>
      <div class="text-muted small">Team login · approved admin numbers only</div>
    </div>

    <div class="card p-4 p-md-5 border-0 shadow-lg text-dark text-center" style="max-width: 440px; width: 100%; border-radius: 12px;">
      <h3 class="fw-bold text-danger mb-3">Access denied</h3>
      <p class="text-muted small mb-3">
        This number is not an admin account. Admin access is given only by the PARTBASE team.
      </p>

      <div class="alert alert-danger py-2 px-3 small mb-4">
        Seekers and employers cannot open admin pages.
      </div>

      <a href="{{ url_for('auth.landing') }}" class="btn btn-outline-secondary w-100 py-2 fw-semibold">
        Back to PARTBASE
      </a>
    </div>
  </div>
</body>
</html>
