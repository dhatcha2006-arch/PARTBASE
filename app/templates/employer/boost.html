{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="lv-card p-4 p-md-5">
        <h3 class="fw-bold text-white mb-3">Boost Listing</h3>

        <!-- Urgent Boost Info Card -->
        <div class="p-3 rounded-4 mb-4" style="background: rgba(214, 255, 80, 0.12); border: 1.5px solid rgba(214, 255, 80, 0.4);">
          <div class="d-flex align-items-center justify-content-between mb-1">
            <span class="fw-bold text-warning fs-5">
              <i class="bi bi-lightning-charge-fill me-1"></i> Urgent Boost
            </span>
            <span class="font-monospace text-white fw-bold fs-5">₹49</span>
          </div>
          <div class="small text-white-50">
            Pin <strong class="text-white">{{ job.title }}</strong> to the top of the Chennai feed for 24 hours with an elevated Urgent badge.
          </div>
        </div>

        <form method="POST" action="{{ url_for('employer.boost_job', job_id=job.id) }}" class="prevent-double-submit">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <!-- Payment Method Toggle -->
          <div class="mb-4">
            <label class="small fw-bold text-muted text-uppercase d-block mb-2" style="letter-spacing: 0.5px;">Checkout Method</label>
            <div class="d-flex gap-2">
              <input type="radio" class="btn-check" name="method" id="pay_upi" value="upi" checked>
              <label class="btn btn-sm btn-lv-outline flex-fill" for="pay_upi">
                <i class="bi bi-qr-code me-1"></i> UPI
              </label>

              <input type="radio" class="btn-check" name="method" id="pay_card" value="card">
              <label class="btn btn-sm btn-lv-outline flex-fill" for="pay_card">
                <i class="bi bi-credit-card me-1"></i> Card
              </label>
            </div>
          </div>

          <!-- UPI ID Input -->
          <div class="mb-4">
            <label class="form-label small fw-semibold">Virtual Payment Address (VPA / UPI ID)</label>
            <input type="text" name="upi_id" class="form-control" placeholder="username@okhdfcbank" value="shopowner@okhdfcbank" required>
            <div class="form-text small text-muted mt-1">Idempotent checkout. Zero double-charge guarantee.</div>
          </div>

          <button type="submit" class="btn btn-lv-primary w-100 py-3 fs-6 fw-bold mb-3">
            Pay ₹49 &amp; Activate Urgent Boost <i class="bi bi-arrow-right ms-1"></i>
          </button>

          <p class="text-muted text-center small mb-0">
            Encountered an issue? Open a ticket in <a href="{{ url_for('support.support') }}" class="jp-cta-link small">Support</a>.
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
