{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 text-center">
      <div class="lv-card p-4 p-md-5">
        <div class="mb-4">
          <div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 76px; height: 76px; background: rgba(198, 244, 50, 0.15); border: 2px solid var(--jp-blue-hover); color: var(--jp-blue-hover); font-size: 2.2rem;">
            <i class="bi bi-shield-check"></i>
          </div>
        </div>

        <h3 class="fw-bold text-white mb-2">Report Submitted</h3>
        <p class="text-muted small mb-4">
          Tracking Code: <strong class="text-white font-monospace">{{ ticket_code }}</strong>.<br>
          Our team reviews incident reports within 24 hours. The listing is auto-hidden upon receiving multiple complaints.
        </p>

        <div class="d-grid gap-2 mb-3">
          <a href="{{ url_for('seeker.jobs') }}" class="btn btn-lv-primary py-2 fw-bold">
            <i class="bi bi-arrow-left me-1"></i> Back to Jobs Feed
          </a>
        </div>

        <a href="{{ url_for('support.support') }}" class="jp-cta-link small">
          Track Investigation in Support Inbox →
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
